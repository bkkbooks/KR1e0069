body:
  text: 春秋金鎖匙春秋類提要臣等謹案春秋金鎖匙一卷元趙汸撰汸有春秋師説左氏補注諸書已著於録是書撮舉聖人之特筆與春秋之大例以事之相類者互相推勘考究其異同而申明其正變蓋合比事屬辭而一之大旨春秋之初主于抑諸侯春秋之未主于抑大夫中間齊晉主盟則視其尊王與否而進退之其中如謂聖人貶把之爵降侯為子與毛伯錫命稱天王稱錫為彼此相與之詞雖尚沿舊説之陋而發揮書法條理秩然程子所謂其中數十義炳如日星者亦庶幾近之矣考宋沈棐嘗有春秋比事一書與此書大旨相近疑汸未見其本故有此作然二書體例各殊沈詳而盡趙簡而明固不妨于並行也乾隆四十四年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:01bbd75a216bc7ca8fcef75d8fd2a9d3abdb0b47c1f9ac81f2f7845bae6f3b47
