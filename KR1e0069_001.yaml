body:
  text: 春秋金鎖匙元趙汸撰元年春王正月春秋書元年自隱公始春秋書王正月亦自隱公始元年云者謹人君繼世體元之始也王正月者謹天下奉周正朔之始也一則存一國之體一則存一王之體春秋嚴矣無駭帥師入極柔㑹宋公盟于折隱二年年桓十一春秋以前征伐之權不下於大夫也而大夫專兵自無駭之帥師入極始春秋以前禮樂之權不下于大夫也而大夫專盟自柔之㑹宋盟折始聖人于無駭去其氏者謹大夫專兵之始也于柔去其氏者謹大夫專盟之始也齊侯宋人㑹于北杏宋齊伐郳莊十三年十五年伯主專天下禮樂之權自齊桓北杏之㑹始伯主專天下征伐之權自齊桓伐郳之役始春秋于北杏之㑹人四國之君者謹其從伯之始所以不與伯主以禮樂之權也于伐郳之役加宋于齊之上者謹其摟諸侯之始所以不與伯主以征伐之權也齊侯鄭伯盟于石門蔡侯鄭伯盟于鄧隱三年桓二年齊楚爭鄭之勢成于莊僖之世而其機萌於隱桓之時春秋書石門之盟者謹鄭從齊之始也書于鄧之㑹者謹鄭懼楚之始也滕侯薛侯來朝公及齊侯鄭伯入許隱十一年春秋書朝三十六而滕薛之朝為之始滅國三十六而滅許為之始是邦交兵交之變也非天子不旅見于諸侯而旅見於諸侯可乎許無罪而覆宗亡國至分為東西偏亦亡矣春秋特以旅見書憂朝覲之始變也不以滅許書而以入許書憂封建之始壞也是特筆也是隱辭也公至自唐公至自伐鄭桓二年十六年戎盟唐而至自唐為致㑹之始伐鄭至自伐鄭為致伐之始交戎人于㑹盟者非義之禮也納厲公于㑹伐者非義也威也魯雖有非義之禮而春秋則不忍虧中國之禮故書至自唐危之也魯雖有非義之威而春秋則不忍虧中國之威故書至自伐不得意皆謹始之書也季孫行父止戰于鞍季孫宿叔老止㑹于向春秋以來大夫帥師者有矣未有四卿帥師者也四卿帥師自成公二年于鞍之戰始大夫列㑹者有矣未有二卿列㑹者二卿列㑹自襄公十四年于向之㑹始春秋之法將稱元帥使舉上客而二卿列㑹四卿帥師所以著大夫之張也亦所以謹其始也元年春王正月西狩獲麟春秋之作所以明王道者也大而禮樂刑政聖人蓋律之以文武成康之盛小而紀綱法度聖人亦律之以文武成康之盛也蓋甚欲王道之復行於天下也作始於王正月之一語以王道正春秋之始也以為由是而尚可以為成康之盛也奈何天下之事不能盡如聖人之意內而諸侯不奉一王之法外而四裔不奉一人之法然猶未有以知王道之果不可行也至於麟出焉然後知王道之無徵也絶筆于西狩獲麟之一語以天道正春秋之終也以為占之於天必將有戰國之衰也齊鄭盟于石門荆敗蔡師于莘晉師虞師滅下陽吳伐郯於越敗吳于檇李齊國書帥師及吳戰于艾陵公㑹晉侯及吳子于黃池楚公子申帥師伐陳於越入吳晉魏曼多帥師侵衛成春秋二百年之世變者齊為之首也楚為之次也其次晉也其次吳也越又其次者也天下無齊晉楚吳越春秋不作可也石門之盟齊患之始也敗蔡之師楚患之始也下陽之滅晉患之始也伐郯之役吳患之始也檇李之敗越患之始也艾陵之戰齊患之終也黃池之㑹吳患之終也伐陳之役楚患之終也入吳之舉越患之終也侵衛之舉晉患之終也然世變之始來也三五强國紛紜縱橫猶相望于二百年間此春秋之所以猶得為春秋者也及世變之已極也三五强國交舉迭作遂見於不數年之間此春秋之所以不可復為春秋者也陳人蔡人從王伐鄭齊侯衛侯伐晉桓五年哀元年春秋之所以始也為天下之無王也春秋之所以終也為天下之無伯也春秋之初周為天下之共主而鄭伯不朝至勤王之伐則天下無王之禍鄭實為之也春秋之終晉為中國伯主而齊景不服至敢晉國之伐則天下無伯之禍齊實為之也一則無王一則無伯此固春秋之所以始終也陳人秦人從王伐鄭劉子單子以王猛入于王城春秋之所以得為春秋之初者以王室猶能自立於天下而諸侯猶知以臣從君之義也春秋之所以遂為春秋之終者以王室不能自立於天下而不能不有賴於臣下之扶持也始則從王終則以王亦可見為春秋世變之始終矣莒人入向鄭人伐衛楚公子申伐陳於越入吳春秋書入國之事凡二十有一而始於入向終于入吳書伐國之事凡二百十有三而始于伐衛終于伐陳聖人于莒人以入向書于鄭人以伐衛書者所以正世變之始也于越以入吳書於楚人以伐陳書者所以正世變之終也鄭伯使弟語來盟齊髙子來盟楚屈完來盟于師衛侯使孫良夫來盟來盟不書而春秋必書鄭語齊髙子衛良夫之來盟者所以詳內録也來盟不書而春秋必書楚屈完之來盟者所以為大中夏也詳內録者備一國之體也大中夏者體天下之變也鄭人來輸平宋人及楚人平暨齊平及齊平及鄭平平不書必有關于我魯而後書外平不書必有關于天下之大故而後書由鄭人之輸平以至于暨齊平及鄭平之事皆無關于天下之大故者也而春秋必書之者以其有關于我魯也來輸平之後暨齊平之前其事非有關于我魯者也而春秋亦必書之者以其有關于天下之大故也及宋人盟于宿公及齊大夫盟于蔇及髙傒盟于防及晉處父盟及盟未有不書其人之姓氏者書其人之姓氏者義繫于其人也若盟宿而書宋人則微者而名氏未登于史冊也盟防而書髙傒盟晉而書處父則意在抑二子之敢于上抗也不書其人之姓氏者義不繫于其人也于蔇之盟上不同于宿之盟下不同于髙傒處父之例春秋蓋深惡大夫之專而謹其自齊始也及髙傒盟于防及晉處父盟及晉荀庚盟及衛孫良夫盟及盟而言其地者盟于國都之外也髙傒之盟是也及盟而不書其地者盟于吾國之都也荀庚良夫之盟是也至若處父之盟則與髙傒盟防相似而非荀庚良夫之比矣春秋書之不例于髙傒盟防之法而例于荀庚良夫之法者不忍使我公往晉而與處父盟矣晉侯云云伐秦公至自伐秦春秋之法前事大則以前事致後事大則以後事致晉文㑹溫之後諸侯有圍許之師圍許之事蓋大於㑹溫也春秋致圍許而不致㑹溫非以圍許之事為大也以諸侯猶能奉王法也成公如京之後諸侯有伐秦之舉伐秦之事不大於如京也春秋致伐秦而不致如京非以伐秦之事為大也以諸侯為急於狥伯主也公㑹齊侯止侵蔡遂伐楚公至自伐楚公㑹齊侯止伐鄭諸侯遂救許公至自伐鄭中國之患楚為之齊桓是以有伐楚之師而伐楚之先則有侵蔡之役楚人之患鄭為之齊桓是以有伐鄭之師而伐鄭之後則有救許之役春秋前則不以侵蔡致而以伐楚致者以伐楚之事為大于侵蔡也聖人惡楚之心甚于惡蔡也後則不以救許致而以伐鄭致者非以伐鄭之義為大于救許也聖人惡鄭之心甚於惡許也遂伐楚盟于召陵公至自伐楚公㑹晉侯止伐鄭㑹于蕭魚公至自㑹僖四年年襄十一春秋於齊桓不致以盟于召陵而致以伐楚者聖人以齊桓之所以服楚者在于八國之伐有以挫其志而不在于召陵之盟有以得其心也蓋王貢不供受以為罪有不待于盟于召陵之日也於晉悼不致以伐鄭之師而致於蕭魚者聖人以晉悼之所以服鄭者在于蕭魚之㑹有以懷其心而不在伐鄭之師有以挫其志也蓋樂器車甲以賂晉侯有以待于蕭魚既㑹之時也君子觀乎我魯告至之書而二伯成功之實為不可掩矣侵蔡遂伐楚公至自伐楚公如京師遂㑹晉侯止伐秦公至自伐秦僖四年年成十三齊桓以侵蔡伐楚二事出疆而告至之書春秋舍前事而録後事者聖人非以蔡人附楚擾夏之罪為可恕也以齊桓之本志在于伐楚也晉厲以如京伐秦二事出疆而告至之書春秋舍前事而録後事者聖人非以相率朝王之事為非禮也以晉厲之本志在于伐秦也遂伐楚盟于召陵公㑹劉子晉侯止于召陵侵楚既伐之後而有盟則盟者所以收伐之功也未伐之先而有㑹則㑹者所以開伐之端也齊桓帥諸侯以伐楚而後為召陵之盟則召陵之盟不過收遂伐之成功而非以謀諸侯之不協也晉昭合諸侯以伐楚而先為召陵之㑹則先為召陵之㑹所以謀諸侯之不協而非以收侵楚之成功也公㑹齊侯宋公止侵蔡遂伐楚晉陽處父伐楚以救江僖四年文三年終春秋一經伐楚之書惟齊桓與晉襄有之耳聖人不以侵蔡繫之伐楚之下而加於其上者以伐楚為因侵蔡而行也所以著桓公之御外服者為有其道也不以救江加之伐楚之上而繫之其下者非以救江為因伐楚而行也所以著晉襄之救與國為非其道也齊師宋師曹師次于聶北救邢叔孫豹救晉次于雍榆僖元年三年襄二十不曰救邢次于聶北而以救邢繫於次之下者蓋後言救則是猶有救患之行聖人以為桓之救邢終不至如他人之以次而遂無心以救患者也不曰次于雍榆以救晉而以救晉加於次之上者蓋後不言救則是終無救患之心聖人以為豹之救晉不能如齊桓之既次而猶有心於救患者也觀於春秋書次先後之異而其心同異可知矣春王正月不雨夏四月不雨自正月不雨至於秋七月僖三年年文十三不雨每時而一書者閔雨也不雨歷時而總書者不憂雨也春秋喜其有志乎民故春不雨而書夏不雨而書辭繁而不削者以著其勤於民也春秋惡其無志乎民故自正月不雨至秋七月而書辭簡而不贅者以著其慢於民也惟其閔雨故夏四月之下繼之曰不雨惟其不憂雨故秋七月而下不書不雨筆削之㫖明矣遂伐楚次于陘次于厥貉伐麋僖四年文十年不言次于陘伐楚而以伐楚繫於次陘之上者蓋既伐之後而次則其次為有整兵慎戰之意不言伐麋次于厥貉而以厥貉加於伐麋之上者蓋未伐之先而次則其次為聲威恐人之意齊桓以伐楚之後而次于陘而君子以其次為善者以齊為能修文告以感敵也楚子未伐麋之先次于厥貉而君子不以其次為善者以楚為藏禍心以慿夏也公救成至遇叔孫豹帥師救晉次于雍榆救成而至遇其事與救晉次于雍榆無以大相逺也而春秋於救成以至遇書而不以次書者聖人以為襄公之於成實有救之之心第畏齊而不敢進非終無此心而外為是以欺人也於救晉以次于雍榆書而不以至書者聖人以為襄公之於晉實無救之之心第欲掠取為義之名非畏齊而不敢進者之比也蓋至者至此之謂也他日之進固未可知也次者止此而已他日之不進固可前知也齊師宋師曹師次于聶北救邢遂次于匡公孫敖帥師及諸侯之大夫救徐後言次而先序三國之師是三國之次于聶北以救邢而次也先言次而後舉救徐之大夫是諸侯之次于匡不以救徐而次也以救邢而次者伯主拯患之不篤也不以救徐而次者伯主號令之不嚴也拯患之不篤而號令之猶嚴此所以為伯主之始號令之不嚴而拯患之不篤此所以為伯業之終齊師宋師次于郎楚子蔡侯次于厥貉次于郎齊創伯之難也次于厥貉楚爭伯之難也人心之始不忍於無王而决於從伯故齊桓創伯之為難人心之終不忍於無伯而决於從夷故楚子之爭伯為難惟齊桓之創伯難故以次于郎書惟楚子之爭伯難故以次于厥貉書蓋次者人心不决於去就之義也圍宋彭城遂城虎牢以伯主攘外患安中國之地非外服所可得專以伯討不服從之國則天下之險非諸侯之所得私是故彭城非宋有也伯主為宋討則還繫之宋虎牢本鄭地也伯主當討鄭則不繫之鄭一筆一削春秋明王制以示豫奪之正也臧孫辰告糴于齊公子遂如楚乞師不曰如齊告糴而曰告糴于齊蓋先言告糴則其情急後言告糴則其情緩聖人急其辭於告糴之書者深譏魯之君臣政事不修遇事苟且非所以為國也不曰乞師于楚而曰如楚乞師蓋先言乞師則其情急後言乞師則其情緩聖人緩其詞於乞師之書者不忍言中國之諸侯有求於荆楚如此其急也圍宋彭城圍戚不曰圍彭城而曰宋彭城者不與荆楚取中國之地以與叛臣也不曰圍衛而止曰戚者不與齊衛二國之大夫助子以圍父也春秋之微意也諸侯城緣陵仲孫羯㑹晉荀盈云云城把齊桓之城把也公其心於救天下之患者也晉平之城把也私其心救一國之患者也惟夫公其心於救天下之患故緣陵之城以諸侯書其意若曰諸侯同心於救天下之患其書不可以一二序也惟夫私其心救一國之患故城把之城列序諸侯其意若曰諸侯無心於救一國之患其書不容以先後序也均之為城把也而春秋所書若此得非以公心救患者非私心救患者所可比耶戍陳戍鄭虎牢悼公之戍陳也實欲斷荆楚之路以為陳蔽也非駐師扼險以恐陳也悼公之戍鄭也實欲駐師扼險以逼鄭也非斷荆楚之路以為鄭蔽也悼公之志在於斷荆楚之路以蔽陳故春秋戍陳而不斥其地者若曰公之所戍在於一國所以大公之為也悼公之志在於駐師扼險以逼鄭故春秋書戍鄭而直稱虎牢者若曰公之所戍在於一邑所以小公之為也齊師宋師曹師城邢城楚丘邢危而安之是方伯恤患之義也當為而為也衛亡而存之是天子封國之權也不當為而為之也春秋言城邢而不書夷儀者以天下大義可自伯主出也言城楚丘而不言衛者以天下大權不可不自天子出也公朝于王所公如京師僖公之朝王也不于京師之地而于王所似非聖人之所與也而春秋則不以王所非其所之故而大書朝者以僖公之心誠於朝王也成公之朝王也不于王所而于京師之地宜聖人所深豫也而春秋則不以朝王於京師之故而直書如者以成公之心為不誠於朝王也朝者以臣事君之禮也僖公之事周為其王豈成公之比乎如者列國相朝之禮也成公之視周如列國又豈僖公之比乎公子遂如京師遂如晉公如齊仲孫蔑如京師僖公之於周也有公子遂如京師之事宣公之於周也有仲孫蔑如京師之事僖公之於周曰如於晉曰如不過昧輕重之等而一槩施之耳而先如京師後如晉國固未嘗失先後之序也宣公之先如齊國後如京師不惟失先後之序也而君如齊臣如周殆失輕重之等而倒行逆施之矣公如齊公如晉公如京師公如楚如者列國相朝之謂也齊楚為天下伯主魯公之朝以朝書可也而乃以如書者聖人以為齊晉雖强且大爵則同列故也至於王室則非齊晉比矣魯君之朝以朝書之誰曰不宜而亦以如書者聖人以為魯之所以事周者無異於事伯故也至於楚則固不可以上侔周室而下與齊晉同日語者也魯之朝也削而不書可也而亦以如書之者聖人以為魯之所以事楚者殆無異於事周故也視王室如列國視楚國如王室春秋蓋不能不致憾於秉禮之魯云天王使周公來聘公子遂如京師遂如晉取濟西田公子遂如晉天王使冡宰來聘其為禮蓋甚厚也魯於周室亦宜視施為報矣而公子遂之如京師乃以二事出所以報乎周者於是為不專焉晉侯以濟西之田歸我其為利甚微也魯人於此視施為報可也而公子遂之如晉不聞以二事出所以報乎晉者於是為甚專焉聖人比而書之所以著魯之慢王畏伯也公如京師公自京師遂㑹諸侯止伐秦公至自伐秦周天子也可以言朝不可以言如如京大事也不可以不致而乃以伐秦小事致春秋書如京師者以為諸侯之狥私而忘公也是以原其從伯之實也諸侯城緣陵大夫盟溴梁緣陵之城伯主在也春秋以伯主書也蓋未害也乃以諸侯自城書而不以伯主列序者以為天下於是而後無伯主也天下非果無伯主也而所以為伯主者皆天下之諸侯也溴梁之盟諸侯在也春秋以諸侯書也亦未害也乃以大夫書而不係於諸侯者以為天下於是而後無諸侯也天下非果無諸侯也而所以為諸侯者皆天下之大夫也自緣陵既城而齊伯衰溴梁既盟而晉伯微矣公㑹諸侯晉大夫盟于扈宋公陳侯云云㑹晉師于棐林伐鄭晉以大夫主盟多矣而未嘗直以晉大夫為言者獨至于扈之盟則大書諸侯於上而於晉大夫不紀其名聖人蓋以為於是之時大夫專盟天下已不知晉之有君也晉以大夫主征伐者亦多矣而未嘗不斥言大夫之名氏者獨至棐林之役則列序諸侯而以㑹晉師為文聖人蓋以為當此之時晉付其權於大夫而天下惟知晉之有大夫也天下不知晉之有君非天下之小變也天下惟知晉之有大夫非天下之細故也考當時行事之跡究春秋筆削之㫖斯可以見聖人憂世變之心矣盟雞澤豹及諸侯之大夫及陳袁僑盟㑹溴梁大夫盟雞澤之盟晉人伯業方盛之日也伯業方盛則盟誓之權雖大夫而統其權者猶在諸侯既盟而陳使袁僑如㑹則書曰叔孫豹及諸侯之大夫以大夫歸之諸侯以諸侯為猶能統其權也溴梁之盟晉人伯業已衰之日也伯業已衰則盟誓之權既付之諸大夫而諸侯失政則無以統其權矣故諸侯皆在而使諸侯之大夫自相為盟則書曰大夫盟矣不以大夫歸之諸侯以諸侯無以統其權也及晉處父盟公孫敖會晉士縠盟于垂隴前此未有大夫盟魯者也自處父始他日卻犨荀庚祖述於此矣前此亦未有大夫出主諸侯盟㑹者也自士縠始他日大夫盟雞澤盟溴梁又以此為口實矣處父及盟不書公所以存望國之君之體也不使晉大夫强於望國之君也况公如晉不書其為魯㑹也可知矣士縠書於諸侯之下所以存列國之君之體也不使晉大夫加於外國之君也以宋書公陳書侯鄭書伯其尊君卑臣也可知矣遂伐楚諸侯遂圍許楚之為國畢獻方物之禮蓋亦有聞也而王貢不入包茅不供齊是以有遂伐之師春秋之世之伐諸侯者多矣未有伐當其罪如此者故春秋於此以繼事之辭書而書遂許之為國班瑞輯瑞之禮蓋亦有聞也而踐土不朝河陽不㑹是以有遂圍之討春秋之世之圍諸侯者多矣未有圍當其罪如此者故春秋於此亦以繼事之辭書而書遂公子遂如京師遂如晉齊侯伐衛遂伐晉如京之與如晉其事為孰重伐衛之與伐晉其事為孰大公子遂之如京師禮也而如京師之後繼以如晉則於禮非矣齊莊公之伐衛未害也而伐衛之後繼以伐晉則為罪大矣春秋不以如京如晉並書而以如晉為遂事者著魯之敢於無王也以為自是而後天下將不知有王也不以伐衛伐晉並書而以伐晉為遂者責齊之敢於無伯也以為自是而後天下將不知有伯也公子遂如京師遂如晉公如京師遂㑹晉侯止伐秦公子遂之如京師本以如晉之後而後有行也而春秋不以如京師為遂事而以如晉為遂事者以明聘王之事為大於聘伯所以為人臣之禮也成公之如京師也本以伐秦之故而後有行也而春秋不以如京師為遂事而以伐秦為遂事者以明朝王之事為大於伐秦亦所以存人臣之禮也公㑹齊侯宋公止侵蔡遂伐楚楚子鄭人侵陳遂侵宋齊之伯王室之憂也楚之伯中國之憂也齊桓之侵蔡伐楚春秋不各書之而以伐楚侵蔡之為遂事者所以著齊桓之伯也以為自是而後征伐諸侯之權專於齊桓也楚莊之侵陳侵宋春秋不各書之而以侵宋侵陳之為遂事者所以著楚莊之伯也以為自是而後征伐諸侯之權專於楚莊為中國之憂方大聖人安得不致微意於遂之一字乎齊侯伐衛遂伐晉晉士鞅侵鄭遂侵衛晉自文公既伯以來世主夏盟未有敢伐之者也而伐晉之師首見於齊莊復伯之時衛自晉之為伯以後世事伯主未有忍伐之者也而伐衛之師首見於晉定不能為伯之日春秋於伐晉書遂者所以著齊人之果於伐盟主也以盟主而果於伐之則其果於伐他國者從可知矣侵衛而書以遂者所以著晉人之果於伐與國也以與國而果於伐之則其果於伐他國者又可知矣遂及齊侯宋公盟遂如晉莊十九年僖三十年春秋之書遂一也而有善惡存焉亦觀其行事之是非而已矣利害出於一時而制之於千里之外當此時而不遂不可也上不足以利國下不足以利民可以復命而後請當此時而遂不可也公子結將及齊宋盟而書遂者聖人蓋曰大夫出疆可以專安國家利社稷之事也公子遂如京修聘因以如晉而書遂者聖人蓋曰大夫驕蹇而自專則公不得為政矣均之為書遂也而褒貶不同君子則考其行事之當否則見之矣公㑹王人齊侯止盟于洮㑹王人止盟于翟泉齊桓于洮所盟者實王朝之下士也非王朝之卿士也春秋以王人書者直其辭以著其實也以桓公為能盡尊王之禮也晉文翟泉之所盟者實王朝之卿士也春秋亦以王人書者婉其辭以隱其實也以文公不能盡尊王之禮也考其事迹之異而觀其書法之同亦可見聖人之意矣盟于鹿上㑹于黃池僖二十一年哀十三年鹿上之盟三伯為盟之時也春秋不以三伯之辭書之者隱其事於不書以見當時之去齊桓之伯猶未逺也黃池之㑹兩伯為㑹之時也春秋遂以兩伯之辭書之者著其事於大書以見當時之去文悼之伯已逺也齊桓之伯未逺而世道之變有三伯交主夏盟之事聖人於是蓋不忍於有言也文悼之伯既逺而世道之變有兩伯並主諸侯之事聖人於是蓋不容於無言也公㑹晉侯云云吳人于戚㑹于宋豹及大夫盟于宋襄五年七襄二十年襄公五年于戚之㑹晉與其盟也春秋止書㑹不書盟者以前乎此吳未嘗爭伯于中國也二十七年于宋之㑹晉與楚盟也春秋既書㑹又書盟者以為前乎此楚蓋嘗爭伯於中國也吳未嘗有爭伯中國之事而其端見于戚之㑹聖人誠有所不忍書也楚蓋嘗有爭伯中國之事而其事極於宋之㑹聖人誠不容於不書也吳楚之盟不可與列國之盟齒亦可以見聖人之憂心矣齊侯次五氏定九年次垂葭十三年齊侯衛侯伐晉哀元年定公季年齊衛已有叛伯伐晉之師而春秋止書次不書伐者以為猶可以不書也哀公元年齊衛又有叛伯伐晉之師而春秋不書次大書伐者以為不可以不書也齊衛叛晉中國於是乎無盟主矣夷儀之伐河內之師聖人誠有所不忍書也哀公既立春秋於是將絶筆矣乾侯之師棘蒲之役聖人不得不書也均之為叛伯伐晉之師也而春秋或書或不書亦可見聖人憂世之心也晉秦戰于河曲文十二年季孫行父帥師城諸及鄆河曲之戰晉秦四五十年兵爭之終也諸鄆之城莒魯百餘年兵爭之始也秦晉四五十年之兵爭終于河曲之一戰而春秋以諸鄆書而不係之莒者兵爭方始誠不忍於有言也聖人於此則曰秦晉者他日兵爭已極之莒魯也莒魯者前日兵爭方始之秦晉也或要其終或究其始斯可以斷春秋書諸侯兵爭之事矣公會晉大夫盟于扈文七年宋公陳侯止㑹晉師于棐林晉以大夫主諸侯之盟者舊矣其事不始于扈之盟也然流而至於扈之盟聖人雖欲盡為之隱而有不可得者故變其常辭以晉大夫書若曰自是而後天下惟知晉之有大夫也晉以大夫用諸侯之師者多矣其原乃自棐林伐鄭始也其原始於棐林之役聖人雖欲不為之隱而不可得者故變其常辭而以晉師書若曰是役也晉衛未嘗以大夫用諸侯之師也以大夫主諸侯之盟其事極於扈而聖人不為之隱以大夫用諸侯之師其事始于棐林而聖人猶為之隱何也蓋棐林之役猶前日以大夫主諸侯之盟之始而于扈之役猶後日以大夫用諸侯之師之終也蔡以吳及楚戰于柏舉㑹于黃池定四年年哀十三於蔡書以者以蔡為用大國之兵也是以書大國之辭書吳也於黃池書㑹以及者以吳與晉為兩伯也是以書伯者之辭書吳也柏舉之戰吳人欲爭伯於中國之時也而春秋止以書大國之詞書之者以為吳人爭伯之時猶可遏也黃池之㑹吳人與晉共主諸侯之時也而春秋不以書大國之辭書遂以書伯主之辭書之者以為吳人爭伯之勢於是為不可遏也吳人爭伯之勢猶可遏而聖人止以待大國之禮待之者不忍使吳伯中國也吳人爭伯之勢不可遏而聖人遂以待伯主之禮待之者不容不使吳伯中國也齊侯來獻戎捷楚人使宜申來獻捷莊三十一年僖二十一年通春秋一體獻捷之事凡兩書一則齊人之獻戎捷也一則楚人之獻宋捷也齊之獻戎捷以逺略而誇與國也楚之獻宋捷以內侮威中國也然而在齊可以俘戎名在楚不可以俘宋名此一王之大法也春秋於齊獻捷而書戎者著其實也著其實者以齊可以俘戎也於楚獻捷不書宋者沒其實也沒其實者不以楚得俘宋也遂㑹晉侯止伐秦公㑹尹子晉侯止伐鄭公㑹尹子單子晉侯止伐鄭伐秦之役二王卿在而春秋不書劉子成子㑹伐者此隱於不書也所以尊王室也伐鄭之役王卿亦在而春秋屢書尹子單子主兵者此顯於屢書也亦所以尊王室也宋人齊人伐郳㑹盟于齊莊十五年僖十九年春秋之法㑹盟征伐以主者先例之常也伐郳之役齊桓為志非宋主兵也而春秋不以齊主兵而加宋於齊上者不以中國征伐之權與齊也以為以伯主而主諸侯前乎齊桓之所未見也盟齊之役楚子為志非陳主盟也而春秋不以楚主盟而加陳於楚上者不以中國㑹盟之權豫楚也以為以荆楚而主夏盟前乎是時之所未有也公孫敖㑹宋公云云晉士縠盟于垂隴叔老㑹鄭伯晉荀偃衛寧殖宋人伐許春秋之法㑹盟征伐以主者先垂隴之盟晉為伯主則晉主也晉主之則曷為不先書晉而先書宋大夫不可以先諸侯也春秋以士縠序諸侯之下者不以㑹盟之權豫大夫欲推而屬之宋也伐許之役晉為伯主則亦為之主也晉主之曷為不先書晉而先書鄭大夫不可以先諸侯也春秋以荀偃序鄭伯之下者不以征伐之權豫大夫欲推而屬之鄭也春秋之為書所以正名而定分者也城楚丘蔡侯廬歸于蔡陳吳歸于陳衛嘗滅矣楚丘之城齊桓復封之也齊桓復封之則其不言齊桓封衛何也封國天子之大權不與齊桓以封衛者以為天子之大權不可得而自伯主出也陳蔡亦嘗滅矣廬吳之歸楚平復封之也楚平復封之則其不言楚封陳蔡者以為天子之大權不可逸而歸於夷狄也宋陳衛云云㑹晉師于棐林公㑹晉師于瓦終春秋十二公之世不以晉大夫名氏書而以晉師書者二始于棐林終于瓦棐林之不以趙盾書何也趙盾者晉之大夫大夫不可以敵諸侯者也列序諸侯而以㑹趙盾為文則臣疑於君不可以訓不若以晉師總言也于瓦而不以晉士鞅書者又何也士鞅者晉之大夫大夫不可以敵人君者也大書我公而以㑹晉士鞅為文則臣疑於君不可以訓又不若以晉師書也於此見春秋之謹於分也豹及大夫盟于宋襄二十七年盟于臯鼬于宋之盟楚主夏盟而春秋隱之使若為魯主諸侯之盟者其意若曰于宋之盟雖楚主之而楚為荆蠻决不可以主中夏之盟以叔孫豹及之者推其權以屬諸魯也以為中國不幸而有楚也臯鼬之盟晉主諸侯而春秋隱之使若為魯主諸侯之盟者其意若曰臯鼬之盟雖晉主之而晉政衰微决不能以主諸侯之盟故以我公及之者推其權以與諸魯也以為中國不幸而無伯也宋人以齊蔡衛陳伐鄭宋人齊人衛人伐鄭宋以諸侯伐鄭之役伯主專諸侯之兵之端也齊合宋衛伐鄭之役伯主專諸侯之兵之始也聖人於宋人書以者不與宋人之以諸侯也以為他日伯主專諸侯之兵固始於此也聖人序齊桓於宋下者不與齊桓之專諸侯也以為是伯主摟諸侯以專征伐之始也不與宋之以諸侯者所以塞其源不與齊之專諸侯者所以防其流塞其源防其流而後征伐之權猶可以自王室出也秦人伐晉晉處父伐楚以救江伐晉而秦伯成矣春秋止以人書不以伯書不以伯權豫秦也伐楚救江請師于周而王叔下臨春秋止書處父不書王叔不以王命豫伯主也聖人蓋曰王命非伯權之資而伯權非秦所可有也楚子鄭人侵陳遂侵宋宋公云云㑹晉師于棐林伐鄭侵鄭遂侵宋楚人之爭伯權也㑹棐林伐鄭趙盾之專伯權也春秋不以秦可雜伯權故書侵不書伐所以抑之也春秋不以大夫主伯權故書㑹晉師不書㑹趙盾亦所以抑之也聖人之所以若是者欲以正內外之分上下之綱也晉侯伐衛晉處父伐楚以救江晉襄之伐衛也先行禮於王室也處父之伐楚也上告王室也春秋書伐衛而不書朝王于溫者聖人不欲以伯權間王室之禮也春秋書處父而不書王叔桓公者聖人不欲以王命豫伯國之盛也蓋尊王大義不可以伯權而屈王室之命不可以伯威而損所以兩不書也處父伐楚救江公㑹晉宋于黑壤伐楚救江止書處父帥師是征伐之權不自天子出也故王叔桓公不書不以主征伐為得也不以王命豫晉侯也所以全一王之體也㑹于黑壤止書公㑹是禮樂之權不自天子出也故王叔桓公不書不以主盟㑹為得也不以王命豫晉侯也亦以全一王之法也齊人伐衛公㑹晉侯止盟于踐土齊桓伯天下則征伐之權之專于桓公必矣而伐衛之役天王又使召伯厚賜齊侯命則吾恐自是而後征伐之權于是不自王室出也晉文伯天下則禮樂之權之專于文公也必矣踐土之盟天王又使王子虎策命諸侯則吾恐自是而後禮樂之權於是不自王室出也春秋止書伐衛不書賜命不忍以王命豫齊桓也止書踐土不書䇿命不忍以王命豫晉文也狄伐鄭遂㑹晉侯止伐秦襄王以狄師伐鄭不書天王賜命若狄自伐然諱之也所以存王室之體也以王室用外裔於中夏為不可言也晉厲以王師伐秦不書劉成㑹伐若諸侯自伐然諱之也亦所以存王室之終也以伯主儕列卿於列國不可言也公㑹宋公止于袤伐鄭宋公陳侯止于棐林伐鄭春秋之法一美一惡不嫌同辭故有以地而後伐為疑辭者亦有以地而後伐為美詞者四國伐鄭先㑹于袤而春秋以其㑹為疑詞者所以著四國之疑於為義而果於為不義也六國伐鄭㑹晉棐林而春秋以其㑹為美詞者所以著五國知鄭人之罪為不可赦也公㑹齊侯云云㑹世子于首止諸侯盟首止㑹于鹹諸侯城緣陵首止之㑹同於尊王而諸侯之勢大合也于鹹之㑹同於謀把而諸侯之勢已散也惟其諸侯之勢合故首止之盟復舉諸侯者所以著諸侯之合也惟其諸侯之勢散故緣陵之城復舉諸侯者所以著諸侯之散也著諸侯之合而書諸侯者若曰同心協力不可以一二叙也著諸侯之散而書諸侯者若曰雖至不齊不可以先後序也一美一惡無嫌於同也公及齊侯宋公止㑹王世子于首止叔孫僑如止㑹吳于鍾離王世子不可以下同諸侯之㑹而首止之㑹世子在焉聖人以為不可以訓故書及以㑹者使若為王世子在是而諸侯自往㑹焉示不可得而抗也外裔不可以與諸侯之㑹而鍾離之㑹吳人在焉聖人以為不可以訓故書曰㑹以㑹者使若為諸侯在是而吳人自來㑹焉示不可得而同也均之為殊㑹也而褒貶若是班者一美一惡無嫌於同也公㑹宰周公齊侯止于葵丘諸侯盟于葵丘公㑹劉子晉侯止于平丘同盟于平丘㑹盟同地再言葵丘書之重詞之復其中必有大美惡存焉葵丘之盟美之大者也申以五命大明王禁而諸侯咸喻桓公之志束牲載書而不歃血是故㑹盟同地再言葵丘美之也㑹盟同地再言平丘書之重詞之復其中必有大美惡存焉平丘之盟惡之大者也主盟中國奉承齊犧而矜其威力恐迫諸侯以逞其私忿也是故㑹盟同地再言平丘惡之也齊師止城邢仲孫何忌止城成周城諸侯之國而以國書者法之常也城王者之都而亦以國書者例之變也夷儀之城齊桓伯天下之日也春秋不以城夷儀書而書城邢者以為邢國猶能自立於天下足以與諸侯並也成周之城晉昭伯天下之日也春秋不以城京師書而書成周者以為周室不能自立於諸侯之上不過與列國等也均之以為國書也而褒貶若此得不以王室之大盡乎天下而諸侯之大止於一國乎不郊猶三望閏月不告朔猶朝于廟春秋書猶一也而其義有二焉亦觀其行事之是非而已矣曰如此而猶如此者甚之之辭曰不如此而猶如此者幸之之辭也魯人不郊而望祭山川春秋書之以猶者以為魯之郊祭已為非禮而况三望乎書之曰猶所以甚其可已而不已也魯人不告閏月而朝于宗廟春秋書以猶者聖人以告月之禮雖不可復見而其朝則猶可識也書之曰猶所以幸其可已而猶未已也楚子止淮夷㑹于申楚子蔡侯止越人伐吳春秋內諸夏而外四裔而昭公四年于申之㑹淮夷在焉春秋不殊㑹之者以為楚靈結其强暴威脅中夏以為申之㑹而中國諸侯俯首聽命莫之或違是在㑹諸侯皆畏懾其行也昭公五年伐吳之役於越在焉春秋驟進於中國者以為楚靈大振兵威執信討罪以為伐吳之役而微若於越非索賦受職不敢或後是越人之善與中國無以大異也均之為不殊㑹外裔也而褒貶若是班者春秋蓋曰所為惡則中國不殊於外裔所為善則外裔可進於中國也遂伐楚處父伐楚救江侵楚終春秋二百四十二年間伯主加兵於楚之事凡三而聖人則以為莫善於齊桓莫不善於晉定而晉襄則上雖不能及齊桓下猶不至如晉定者也於齊桓書遂伐楚書法之一變也而問膠舟責包茅之師為善之善者也於晉襄書伐楚以救江書法之再變也以㑹王叔門方城之師為未盡善也於晉定不以伐楚書而書侵楚書法之三變也以晉之求貨於蔡侯而不與以有為也均之為加兵于楚也而書法凡三變聖人之心夫亦可見矣蔡人止從王伐鄭公㑹晉侯齊侯于溫仲孫何忌止城成周桓王討鄭之舉雖不能無賴於陳蔡之師而征伐之權猶自王室出也是世道之一變也王室猶可為也逮至襄王之時不能自靖其國之難而有待於伯主諸侯之謀於是征伐之權降自諸侯出矣是世道之再變也然而靖之而已耳王室猶可扶持也逮至敬王之時王室實蠢蠢焉不惟不能自立而京師之城且以伯主為焉依之主矣是世道之三變也於是王室為不可復扶持也觀乎王室之勢日微於一日可以見春秋之世變日下於一日也蔡人止從王伐鄭王人子突救衛王師敗績于茅戎終十二公之世王師之見于經者為是三事焉君子觀其事迹之同異亦可以見盛衰之故矣伐鄭之舉雖用之不當而陳蔡猶以從王書聖人蓋以為是時王室猶有可興之機也救衛之師雖諸侯無從而王人之微猶以子突書聖人蓋以王室於是時猶可以為天下之共主也至於徐吾氏之役不惟王室無制要荒之道而敗績之事亦是大書而不隱焉聖人蓋以為王室於是時自失正於天下也公孫敖㑹宋公止盟于垂隴叔孫豹及諸侯大夫及陳袁僑盟大夫盟垂隴之盟士縠蒞也春秋不以晉大夫書而書其名氏者以為盟誓之權雖付之大夫而統其權者猶在晉君是世道之一變也雞澤之盟袁僑如㑹而叔孫豹與諸侯之大夫及之盟春秋不列書其名氏而總以諸侯之大夫為言雖若大夫已專盟誓之權而歸大夫於諸侯則大夫猶諸侯之臣也是世道之再變也逮至于溴梁之役諸侯不在大夫自盟而春秋上不列序大夫之盟誓中不係大夫於諸侯者以為為政者皆天下之大夫而天下於是為無諸侯也是又世道之三變也㑹陳人蔡人楚人盟于齊楚子止盟于辰陵公及楚人止盟于蜀于齊之盟楚始與中國盟也然而大國無與主盟載者非楚世道其尚庶幾乎辰陵之盟楚始主中夏之盟也然而大國不至從之盟者惟從楚之國世道之憂猶未也至於于蜀之盟非于齊始與夏盟之比而亦非辰陵始主夏盟之比矣大國如齊宋小國如邾莒莫不奔走於刑牲歃血之下則世道之憂方殷也觀乎㑹盟離合之道而夷夏之盛衰可考矣公㑹止于瑣澤叔孫豹㑹晉楚于宋叔孫豹㑹晉楚于虢瑣澤之盟晉人和楚之始也于宋之㑹晉人和楚之中也于虢之㑹晉人和楚之終也其始也隱楚人於不書聖人以為天下之事猶可為而晉伯猶可以扶持之也其終也又著楚于大書聖人以為不惟天下之事不可復為而晉之伯於是亦不可以扶持也矣叔孫豹救晉鄭駟𢎞救曹吳救陳春秋之末世變蓋有三焉魯之救晉世道之一變也鄭之救曹世道之再變也吳之救陳世道之三變也其始也伯主不能以自立而有待於諸侯之救其中也中國無伯主之可控告而諸侯之自相救其終也中國不足以為中國於是勾吳救陳矣諸侯救伯主猶可也諸侯救諸侯亦可也至於吳人之救陳則諸夏亦幾於亡矣初稅畝作丘甲用田賦初稅畝田賦之一變也作丘甲田賦之再變也用田賦田賦之三變也稅田而書初者以是為始變法也丘甲而書作者以是為不宜作也田賦而書用者以為不可用也什一天下之中正而先王取民之良法也稅畝矣丘甲作矣田賦用矣先王取民之良法於是而變易盡矣此固聖人之所必誅而不以法者也㑹齊侯止盟于幽公㑹齊侯止同盟于幽諸侯盟于首止幽之初盟齊桓伯業未盛之日也惟其未盛故㑹不書公而盟以同書幽之再盟齊桓伯業將盛之日也惟其將盛故盟書同而㑹不沒公首止之盟則齊桓伯業既盛之日也惟其既盛故不叙諸侯不必書同盟書盟而㑹不書公是望國有疑於伯主也㑹書公而盟尚書同則望國雖無疑於伯主而天下諸侯猶有未同也至於不序諸國不書同盟而直以諸侯盟大書焉則以為凡為諸侯者於是而後無不同也盟于召陵及國佐盟袁婁叔孫豹及大夫及陳袁僑盟召陵之盟春秋泯齊桓之及於不書書法之一變也齊桓之待楚蓋善之善也袁婁之盟春秋以及書而沒晉侯於不録書法之再變也晉景之待齊蓋已不能如齊桓待楚之為善也袁僑之盟春秋不惟以及書而且以及又及書書法之三變也晉悼之待陳不惟不能如齊桓之待楚而亦不能如晉景之待齊也其始也不書及其中之書及其終也書及以及三變之法即是可知而桓景悼待楚齊陳之得失於是而可見矣把侯來朝荆人來聘把伯來朝楚椒來聘把子來朝楚薳罷來聘把夏禹之後也其來朝也以侯書也一變而伯再變而子何也大扺杞人違周之制禮則弗與中國齒愈趨愈下聖人患之故再奪其爵以示貶楚南方之夷也其始聘也以荆人書也一變而書其臣之名再變而書其名氏何也大扺楚雖僣王其行也以禮則可與中國齒每進每善聖人豫之故再進其法以示褒公如晉衛侯㑹公于沓公及晉侯盟公還自晉鄭伯㑹公于棐文公之如晉也假道于衛衛侯聞之故請平于晉其請平也是信已著而後至也信未著而已至者迫於患難而來也信已著而後至者慕於信義而來也公如齊公至自齊齊人歸濟西田公如齊公至自齊齊人來歸田之先宣公有如齊之舉矣齊人既歸田之後宣公又為如齊之舉矣始之如齊患得之心為之也終之如齊患失之心為之也宣公所以為國者未得之患得之既得之患失之故前後而不憚煩也公㑹齊侯止同盟于幽諸侯盟于葵丘同盟于新城伯業未盛則書同盟伯業既盛則不書同伯業方盛則不書同伯業既衰則書同盟此春秋之法也葵丘之盟齊桓伯業之極盛而亦二百四十年間盟㑹之極盛者也前乎葵丘桓有于幽之盟矣其盟也不可謂不盛也而聖人之書之也以同書也是于幽之盟蓋齊桓未盛之時也不然則聖人曷為不以書葵丘之法書之乎後乎葵丘者有新城之盟矣其盟也亦不可謂不盛也而聖人之書之也以同書也是新城之盟蓋晉伯既衰之時也不然則聖人曷為不以書葵丘之法書之乎㑹鄭于垂鄭假許田及鄭伯盟越未得許田之先而為㑹則為㑹之志出於鄭莊而不出於魯既得許田之後而為盟則為盟之志出於我魯而不出於鄭莊惟其志不出於我魯故春秋以㑹書㑹者外為志也惟其志出於我魯故春秋以及書及者內為志也齊侯止㑹陽穀遂伐楚盟于召陵及江黃伐陳齊桓之於江黃也未伐楚之先則與之從事於陽穀之㑹既盟楚之後則與之從事於伐陳之役蓋功之未成不容無以懷其心是以為陽穀之㑹功之既成不容無以警其心是以有伐陳之及齊人伐戎齊人伐山戎諸侯盟于葵丘齊侯伐北戎葵丘未盟以前齊人有伐戎伐山戎之事葵丘既盟以後齊桓有伐北戎之事蓋葵丘之盟伯業之極盛於是而伯業之衰亦始于是葵丘以前之桓公有志于天下者也故伐戎伐山戎以公不以私葵丘以後之桓公無志於天下者也故伐北戎之事以私不以公宋人止伐鄭荆伐鄭齊之伐鄭是伯圖之將盛也楚之伐鄭是荆蠻之驟强也春秋抑伯圖之將盛故先書宋後書齊春秋抑外侮之驟强故不書楚止書荆先書宋後書齊以常辭正其公也不書楚止書荆以微辭正其名也㑹齊侯止同盟于幽公追戎于濟西天下不可以無王而幽之初盟魯首事伯中國不可以有外侮而濟西之追魯不知戎兵之至春秋為憂王室而作故幽不言公春秋為憂中國而作故濟西不言來幽不言公者以隱辭存君臣之大經也濟西不言來者以隱詞存荆蠻之分也豹及大夫盟于宋王正月公在楚以中國而與荆蠻盟已非矣况以中國而朝楚乎甚矣魯之非禮也前書豹及諸侯大夫盟為其嫌於無諸侯也故書及後書公在楚公至自楚為其嫌於無王室也故書公在楚見天下不可一日無王室也亦不可一日無中國也春秋憂世變之極故特筆謹之有不可以細故末節觀者㑹吳于鍾離㑹吳于柤㑹吳于向㑹于黃池鍾離于柤于向之役㑹以㑹書之一書法也黃池之役㑹以及書之又一書法也蓋鍾離柤向之役晉為伯主而吳人效順春秋一書嚴內外之分故書㑹又㑹以外之至于黃池之役則吳晉兩伯於天下春秋撫天下之兩伯傷世變之已極故書㑹又㑹以治之此皆非細故也㑹吳于鍾離㑹吳于戚鍾離之㑹諸侯往與吳㑹而以吳為主也于戚之㑹吳人來與諸侯㑹而不敢為主也惟諸侯往與吳㑹而以吳為主故貶而稱國惟吳人來與諸侯㑹而不敢為主故進而稱人均之為㑹吳也而春秋所書若此所以明內外之義也天王使毛伯來錫公命天子使召伯成來賜命春秋特筆王命凡二一稱天王一稱天子一書錫公命一書賜命襄王君臣加恩於人望之魯春秋之紀事雖特筆也亦絶筆也惟其為特筆故稱天王稱錫命稱天王者天下之公也以君與臣曰錫是王政之猶重也惟其為絶筆故稱天子稱賜命稱天子者一人之私也彼此相豫曰賜是王政之已輕也從王伐鄭王人子突救衛正刑討罪一王之大法也分災救患一王之大典也從王伐鄭書者以王室正刑討罪之法猶足以聳動天下之諸侯也莊王救衛之舉是匡災之義也春秋於王人以子突救衛書者以王室救患分災之典猶足以聳動天下之諸侯也滕薛來朝滕子來朝郳黎來來朝小邾子來朝滕朝于隱方以侯書距桓公之初年兩三嵗耳而再朝之事乃降而稱子者時王黜之也郳朝于莊方以名書距僖公之初年固未久而再朝之書乃進而稱邾子者時王爵之也以時王而猶能黜降諸侯爵命諸侯此蓋春秋之時王室猶可以有為之時自滕侯降而為滕子之後而王室降黜諸侯之命不行於天下矣自黎來為小邾之後而王室爵命諸侯之典亦不行於天下矣㑹齊侯宋公止同盟于幽㑹陳公止盟于齊會王人止于翟泉春秋假魯以扶持世道之變者也以伯主而主諸侯前乎齊桓未之聞也而肇于幽之盟以荆蠻而與是盟前乎楚未始有是也而始于齊之役以諸侯大夫而上盟王臣前乎晉文未之聞也而創自翟泉之㰱使魯而不與則猶足以為世變中流之砥柱使魯而與則世變蓋有靡然紀極之憂此春秋所以於是三盟沒公不紀使魯之為不與是盟者也盟惡曹盟鹿上同盟于清丘惡曹之盟中國未有伯之時也鹿上之盟中國始無伯之時也清丘之盟中國又將無伯之時也聖人皆以人書之者其意若曰惡曹之盟是中國未伯而人自為盟之盟也鹿上之盟是中國始無伯而人自為盟之盟也清丘之盟又中國將無伯而人自為盟之盟也非以是為衆辭也所以著其為人而人各有心不可得而合也春秋金銷匙
